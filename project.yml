name: Runlight
options:
  bundleIdPrefix: sh.runlight
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JV2VUU6R4W
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Runlight:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
        optional: true
      - path: API
        optional: true
      - path: Services
        optional: true
      - path: Storage
        optional: true
      - path: Views
      - path: Resources
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Runlight
        CFBundleName: Runlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Runlight is open source."
    entitlements:
      path: Resources/Runlight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.runlight.mac
        PRODUCT_NAME: Runlight
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  RunlightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Runlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.runlight.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Runlight:
    build:
      targets:
        Runlight: all
        RunlightTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RunlightTests
